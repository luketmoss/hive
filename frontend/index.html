<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive — Family Board</title>
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <meta name="theme-color" content="#2a1a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%hive-mark.svg" />
  <link rel="apple-touch-icon" href="%BASE_URL%hive-app-icon-180.png" />
  <!-- AC4: Apply data-theme before first paint to prevent flash of wrong theme -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('hive-theme');
        var resolved;
        if (t === 'dark') {
          resolved = 'dark';
        } else if (t === 'light') {
          resolved = 'light';
        } else {
          // 'system' or missing/invalid: follow OS preference
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
      } catch(e) {}
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
