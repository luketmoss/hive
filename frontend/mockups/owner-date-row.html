<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=412, initial-scale=1">
<title>Owner + Date Row Mockup</title>
<style>
:root {
  --color-bg: #f0f2f5;
  --color-surface: #ffffff;
  --color-primary: #C49200;
  --color-primary-rgb: 196, 146, 0;
  --color-text: #1f1f1f;
  --color-text-secondary: #5f6368;
  --color-text-muted: #767676;
  --color-border: #dadce0;
  --color-border-light: #969696;
  --color-overdue: #b71c1c;
  --color-success: #2e7d32;
  --color-surface-raised: #f8f9fa;
  --overlay-xs: rgba(0,0,0,0.02);
  --radius: 8px;
  --radius-sm: 4px;
  --transition-fast: 150ms ease;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.section { background: var(--color-surface); border-radius: var(--radius); padding: 20px; max-width: 480px; }
.section h3 { font-size: 13px; color: var(--color-text-muted); margin-bottom: 12px; }

/* === Combined owner + date row === */
.owner-date-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* Owner circles */
.owner-circle-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.owner-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  transition: all var(--transition-fast);
  padding: 0;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.owner-circle.active {
  box-shadow: 0 0 0 3px var(--color-surface), 0 0 0 5px var(--color-primary);
}
.owner-circle:not(.active):hover {
  transform: scale(1.08);
}
.owner-circle-name {
  font-size: 10px;
  color: var(--color-text-secondary);
  text-align: center;
  max-width: 52px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Divider dot between owners and date */
.row-divider {
  width: 1px;
  height: 32px;
  background: var(--color-border);
  flex-shrink: 0;
}

/* Date section (no label) */
.due-date-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: none;
  border-radius: var(--radius);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition-fast);
  text-align: left;
}
.due-date-btn:hover {
  background: var(--overlay-xs);
}
.due-date-btn svg {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}
.due-date-btn .no-date {
  color: var(--color-text-muted);
  font-size: 14px;
}
.due-date-btn .date-info {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.due-date-btn .date-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text);
}
.due-date-btn .date-relative {
  font-size: 12px;
  color: var(--color-text-secondary);
}
.due-date-btn .date-relative.overdue {
  color: var(--color-overdue);
}
.due-date-btn.has-date svg {
  color: var(--color-primary);
}

/* Quick picks — compact */
.quick-picks-compact {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.quick-pick-sm {
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all var(--transition-fast);
}
.quick-pick-sm:hover {
  border-color: var(--color-primary);
  color: var(--color-text);
}

.note { font-size: 11px; color: var(--color-text-muted); font-style: italic; margin-top: 10px; }
</style>
</head>
<body>

<h2 style="font-size: 16px; color: var(--color-text);">Owner + Date — No Labels</h2>

<!-- Option 1: Date set, single owner -->
<div class="section">
  <h3>Date set, one owner active</h3>
  <div class="owner-date-row">
    <div class="owner-circle-wrapper">
      <button class="owner-circle active" style="background: #e65100;">LU</button>
      <span class="owner-circle-name">Luke</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: var(--color-border); color: var(--color-text-secondary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <span class="owner-circle-name">None</span>
    </div>

    <div class="row-divider"></div>

    <div class="due-date-btn has-date" role="button" tabindex="0" title="Change due date">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      <div class="date-info">
        <span class="date-text">Apr 8</span>
        <span class="date-relative">In 4 days</span>
      </div>
    </div>
  </div>
</div>

<!-- Option 2: No date, two owners -->
<div class="section">
  <h3>No date, two owners</h3>
  <div class="owner-date-row">
    <div class="owner-circle-wrapper">
      <button class="owner-circle active" style="background: #e65100;">LU</button>
      <span class="owner-circle-name">Luke</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #1976d2;">SM</button>
      <span class="owner-circle-name">Sarah</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: var(--color-border); color: var(--color-text-secondary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <span class="owner-circle-name">None</span>
    </div>

    <div class="row-divider"></div>

    <button class="due-date-btn" title="Set due date">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-text-muted)"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="no-date">No date</span>
    </button>
  </div>
  <div class="quick-picks-compact">
    <button class="quick-pick-sm">Today</button>
    <button class="quick-pick-sm">This Fri</button>
    <button class="quick-pick-sm">Next Mon</button>
    <button class="quick-pick-sm">Next Fri</button>
  </div>
</div>

<!-- Option 3: Overdue, many owners (wraps) -->
<div class="section">
  <h3>Overdue, four owners (wraps on narrow)</h3>
  <div class="owner-date-row">
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #e65100;">LU</button>
      <span class="owner-circle-name">Luke</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle active" style="background: #1976d2;">SM</button>
      <span class="owner-circle-name">Sarah</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #2e7d32;">DA</button>
      <span class="owner-circle-name">Dad</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #7b1fa2;">KI</button>
      <span class="owner-circle-name">Kim</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: var(--color-border); color: var(--color-text-secondary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <span class="owner-circle-name">None</span>
    </div>

    <div class="row-divider"></div>

    <div class="due-date-btn has-date" role="button" tabindex="0" title="Change due date">
      <svg viewBox="0 0 24 24" fill="currentColor" style="color: var(--color-overdue)"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      <div class="date-info">
        <span class="date-text" style="color: var(--color-overdue)">Apr 3</span>
        <span class="date-relative overdue">1 day overdue</span>
      </div>
    </div>
  </div>
</div>

<!-- Option 4: Desktop width simulation -->
<div class="section" style="max-width: 100%;">
  <h3>Desktop width — everything on one line</h3>
  <div class="owner-date-row">
    <div class="owner-circle-wrapper">
      <button class="owner-circle active" style="background: #e65100;">LU</button>
      <span class="owner-circle-name">Luke</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #1976d2;">SM</button>
      <span class="owner-circle-name">Sarah</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: #2e7d32;">DA</button>
      <span class="owner-circle-name">Dad</span>
    </div>
    <div class="owner-circle-wrapper">
      <button class="owner-circle" style="background: var(--color-border); color: var(--color-text-secondary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <span class="owner-circle-name">None</span>
    </div>

    <div class="row-divider"></div>

    <div class="due-date-btn has-date" role="button" tabindex="0" title="Change due date">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
      <div class="date-info">
        <span class="date-text">Apr 8</span>
        <span class="date-relative">In 4 days</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
